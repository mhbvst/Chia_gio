services:
  - type: web
    name: hospital-pro-xray-scheduler
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATA_DIR
        value: ./data
      # Tùy chọn: Bỏ chú thích dòng dưới nếu muốn cố định mật khẩu quản trị qua biến môi trường
      # - key: ADMIN_PASSWORD
      #   sync: false
